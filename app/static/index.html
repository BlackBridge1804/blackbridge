<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BlackBridge</title>
<meta name="description" content="Upload your credit report, see what's disputable, and generate FCRA-grounded dispute letters.">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%232f6fed'/%3E%3C/svg%3E">
<meta name="theme-color" content="#2f6fed">
<style>
  :root{
    --bg:#f5f7fb; --surface:#ffffff; --surface-2:#f0f2f7; --border:#e2e6ef;
    --text:#1a1f2b; --text-dim:#5b6272; --brand:#2f6fed; --brand-dark:#1f52c7;
    --ok:#1a8a5f; --ok-bg:#e6f6ef; --warn:#b5790a; --warn-bg:#fbf1de;
    --danger:#c23b3b; --danger-bg:#fbeaea; --radius:12px;
    --shadow:0 1px 2px rgba(20,25,40,.06), 0 4px 14px rgba(20,25,40,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1320; --surface:#171c2b; --surface-2:#1e2436; --border:#2a3145;
      --text:#eef1f8; --text-dim:#9aa3b8; --brand:#5c8dff; --brand-dark:#7ea3ff;
      --ok:#3ecf8e; --ok-bg:#123526; --warn:#e0a83a; --warn-bg:#3a2c10;
      --danger:#f27272; --danger-bg:#3a1c1c;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:var(--brand);}
  h1,h2,h3{line-height:1.25;margin:0 0 .4em;}
  p{margin:0 0 .75em;color:var(--text-dim);}
  .container{max-width:880px;margin:0 auto;padding:0 16px;}
  header.topbar{
    position:sticky;top:0;z-index:20;background:var(--surface);
    border-bottom:1px solid var(--border);
  }
  header.topbar .row{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;max-width:880px;margin:0 auto;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--brand);flex:none;}
  .top-actions{display:flex;align-items:center;gap:8px;}
  .pill{
    font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface-2);
    color:var(--text-dim);border:1px solid var(--border);white-space:nowrap;
  }
  main{padding:20px 0 60px;}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px;margin-bottom:16px;box-shadow:var(--shadow);
  }
  .card h2{font-size:17px;}
  .card h3{font-size:15px;}
  .muted{color:var(--text-dim);font-size:13px;}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .row-wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .grid-2{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:640px){.grid-2{grid-template-columns:1fr 1fr;}}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);}
  input[type=text],input[type=email],input[type=password],input[type=file],textarea,select{
    width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);font-size:15px;font-family:inherit;
  }
  input:focus,textarea:focus,select:focus{outline:2px solid var(--brand);outline-offset:1px;}
  textarea{min-height:90px;resize:vertical;}
  .field{margin-bottom:14px;}
  button, .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--brand);color:#fff;border:none;border-radius:9px;
    padding:11px 16px;font-size:14.5px;font-weight:600;cursor:pointer;
    min-height:44px;line-height:1.1;transition:background .15s ease,opacity .15s ease;
  }
  button:hover{background:var(--brand-dark);}
  button:disabled{opacity:.55;cursor:not-allowed;}
  button.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  button.secondary:hover{background:var(--border);}
  button.danger{background:var(--danger);}
  button.danger:hover{background:#a52d2d;}
  button.link{background:transparent;color:var(--brand);padding:4px 2px;min-height:auto;}
  button.link:hover{background:transparent;text-decoration:underline;}
  button.block{width:100%;}
  .tabs{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:10px;margin-bottom:16px;}
  .tabs button{flex:1;background:transparent;color:var(--text-dim);box-shadow:none;}
  .tabs button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}
  .banner{border-radius:9px;padding:11px 14px;font-size:14px;margin-bottom:14px;}
  .banner.error{background:var(--danger-bg);color:var(--danger);}
  .banner.ok{background:var(--ok-bg);color:var(--ok);}
  .banner.warn{background:var(--warn-bg);color:var(--warn);}
  .badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;}
  .badge.high{background:var(--danger-bg);color:var(--danger);}
  .badge.medium{background:var(--warn-bg);color:var(--warn);}
  .badge.low{background:var(--ok-bg);color:var(--ok);}
  .badge.paid{background:var(--ok-bg);color:var(--ok);}
  .badge.unpaid{background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);}
  .report-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px;border:1px solid var(--border);border-radius:10px;cursor:pointer;
    background:var(--surface);margin-bottom:10px;
  }
  .report-item:hover{border-color:var(--brand);}
  .report-item .meta{font-size:13px;color:var(--text-dim);}
  .violation{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;}
  .violation .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;}
  .letter{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;}
  .letter pre{
    white-space:pre-wrap;word-wrap:break-word;background:var(--surface-2);
    padding:12px;border-radius:8px;font-size:12.5px;max-height:260px;overflow:auto;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .divider{height:1px;background:var(--border);margin:16px 0;}
  .spinner{
    width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .empty{text-align:center;padding:30px 10px;color:var(--text-dim);}
  .backlink{display:inline-flex;align-items:center;gap:4px;margin-bottom:14px;}
  footer{padding:30px 16px 50px;text-align:center;}
  details.admin-toggle{margin-top:6px;}
  details.admin-toggle summary{cursor:pointer;font-size:13px;color:var(--text-dim);}
  .disclaimer{
    font-size:12px;color:var(--text-dim);background:var(--surface-2);
    border-radius:8px;padding:10px 12px;margin-top:10px;
  }
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);}
  th{color:var(--text-dim);font-weight:600;font-size:12px;text-transform:uppercase;}

  .stepper{display:flex;flex-direction:column;gap:0;}
  .step{display:flex;align-items:flex-start;gap:12px;position:relative;padding-bottom:18px;}
  .step:last-child{padding-bottom:0;}
  .step .dot2{
    width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;background:var(--surface-2);color:var(--text-dim);border:2px solid var(--border);
    margin-top:1px;
  }
  .step.done .dot2{background:var(--ok);border-color:var(--ok);color:#fff;}
  .step.current .dot2{background:var(--brand);border-color:var(--brand);color:#fff;}
  .step .line{position:absolute;left:10px;top:24px;bottom:-2px;width:2px;background:var(--border);}
  .step.done .line{background:var(--ok);}
  .step .label{font-size:14px;font-weight:600;padding-top:1px;}
  .step.current .label{color:var(--brand);}
  .step:not(.done):not(.current) .label{color:var(--text-dim);font-weight:500;}

  .client-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px;border:1px solid var(--border);border-radius:10px;cursor:pointer;margin-bottom:8px;
  }
  .client-row:hover{border-color:var(--brand);}

  .chat-toggle{
    position:fixed;right:18px;bottom:18px;z-index:30;border-radius:999px;
    width:56px;height:56px;padding:0;box-shadow:0 4px 18px rgba(20,25,40,.25);
    font-size:22px;
  }
  .chat-panel{
    position:fixed;right:18px;bottom:86px;z-index:30;width:min(360px, calc(100vw - 36px));
    height:min(500px, calc(100vh - 140px));background:var(--surface);border:1px solid var(--border);
    border-radius:14px;box-shadow:0 8px 30px rgba(20,25,40,.3);display:flex;flex-direction:column;overflow:hidden;
  }
  .chat-panel .chat-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .chat-panel .chat-head strong{font-size:14px;}
  .chat-panel .chat-body{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
  .chat-msg{max-width:85%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.4;}
  .chat-msg.user{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:3px;}
  .chat-msg.assistant{align-self:flex-start;background:var(--surface-2);color:var(--text);border-bottom-left-radius:3px;white-space:pre-wrap;}
  .chat-msg-loading{align-self:flex-start;padding:9px 12px;}
  .chat-panel .chat-input-row{border-top:1px solid var(--border);padding:10px;display:flex;gap:8px;}
  .chat-panel .chat-input-row input{flex:1;}
  .chat-panel .chat-input-row button{min-height:40px;padding:0 14px;}
  .icon-btn{background:transparent;color:var(--text-dim);min-height:auto;padding:2px 6px;box-shadow:none;}
  .icon-btn:hover{background:var(--surface-2);}

  .guide-step{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);}
  .guide-step:last-child{border-bottom:none;}
  .guide-step .num{
    width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
    flex:none;margin-top:1px;
  }
  .guide-step .body h3{margin-bottom:4px;}
  .guide-step .body p{margin-bottom:0;}

  .offer-grid{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:640px){.offer-grid{grid-template-columns:1fr 1fr;}}
  .offer-card{
    border:1px solid var(--border);border-radius:10px;padding:14px;
    display:flex;flex-direction:column;gap:8px;
  }
  .offer-card .offer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .offer-card p{margin:0;}
  .offer-card a.btn{text-decoration:none;text-align:center;}
  .offer-admin-row{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;}
</style>
</head>
<body>
<header class="topbar">
  <div class="row">
    <div class="brand"><span class="dot"></span><span id="brandName">BlackBridge</span></div>
    <div class="top-actions" id="topActions"></div>
  </div>
</header>
<main class="container" id="app"></main>
<footer>
  <p class="muted">Not legal advice. Results depend on your specific credit history and are never guaranteed.</p>
</footer>
<script>
(function(){
"use strict";

/* ---------- config ---------- */
// Deployers running their own white-label instance can either hard-code a
// default org slug here, or just always send clients to ?org=<slug>.
var DEFAULT_ORG_SLUG = "";

/* ---------- tiny state store ---------- */
var state = {
  token: null,
  tokenPayload: null, // { sub, type, org, exp }
  view: "loading",     // loading | auth | client | admin | establish | get_report
  establishFrom: null, // which view to return to when leaving the "establish credit" walkthrough
  getReportFrom: null,  // which view to return to when leaving the "get your report" walkthrough
  orgSlug: "",
  reports: [],
  profile: null,        // { address..., service_type, has_address }
  agreement: null,      // signed-agreement status + documents (see /staff/agreement/current)
  authorization: null,  // limited CFPB-filing authorization (see /authorization/current)
  activeReportId: null,
  activeReport: null,   // full detail bundle for the open report
  banner: null,         // { kind, text }
  busy: false,
};

function qs(name){
  var m = new URLSearchParams(location.search);
  return m.get(name);
}

function decodeJwt(token){
  try{
    var payload = token.split(".")[1];
    payload = payload.replace(/-/g, "+").replace(/_/g, "/");
    while (payload.length % 4) payload += "=";
    return JSON.parse(atob(payload));
  }catch(e){ return null; }
}

function saveToken(token){
  state.token = token;
  state.tokenPayload = token ? decodeJwt(token) : null;
  try{
    if (token) localStorage.setItem("crp_token", token);
    else localStorage.removeItem("crp_token");
  }catch(e){ /* private-browsing / storage blocked -- session still works in-memory */ }
}

function loadToken(){
  try{
    var t = localStorage.getItem("crp_token");
    if (t){
      var payload = decodeJwt(t);
      if (payload && payload.exp && payload.exp * 1000 > Date.now()){
        state.token = t;
        state.tokenPayload = payload;
      }
    }
  }catch(e){ /* ignore */ }
}

/* ---------- API layer ---------- */
function api(path, opts){
  opts = opts || {};
  var headers = opts.headers || {};
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  var fetchOpts = Object.assign({}, opts, { headers: headers });
  return fetch(path, fetchOpts).then(function(res){
    // A 204 (e.g. DELETE endpoints) has no body -- FastAPI still sends a
    // "content-type: application/json" header on it, so trusting that header
    // alone and calling res.json() throws on the empty body. Handle 204 first.
    if (res.status === 204){
      if (!res.ok){
        var err204 = new Error(res.statusText);
        err204.status = res.status;
        throw err204;
      }
      return null;
    }
    var isJson = (res.headers.get("content-type") || "").indexOf("application/json") !== -1;
    return (isJson ? res.json() : res.text()).then(function(body){
      if (!res.ok){
        var msg = (body && body.detail) ? (typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail)) : (typeof body === "string" ? body : res.statusText);
        var err = new Error(msg);
        err.status = res.status;
        throw err;
      }
      return body;
    });
  });
}

function apiForm(path, formData){
  var headers = {};
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  return fetch(path, { method: "POST", headers: headers, body: formData }).then(function(res){
    return res.json().then(function(body){
      if (!res.ok){
        var msg = (body && body.detail) ? body.detail : res.statusText;
        var err = new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
        err.status = res.status;
        throw err;
      }
      return body;
    });
  });
}

function apiLogin(username, password){
  var body = new URLSearchParams();
  body.set("username", username);
  body.set("password", password);
  return fetch("/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: body.toString(),
  }).then(function(res){
    return res.json().then(function(b){
      if (!res.ok) throw new Error(b.detail || "Login failed");
      return b;
    });
  });
}

/* ---------- helpers ---------- */
function esc(s){
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function money(cents){
  if (cents === null || cents === undefined) return "—";
  return "$" + (cents/100).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(iso){
  if (!iso) return "—";
  try{ return new Date(iso).toLocaleString(); }catch(e){ return iso; }
}
function setBanner(kind, text){ state.banner = { kind: kind, text: text }; render(); }
function clearBanner(){ state.banner = null; }
function setBusy(b){ state.busy = b; render(); }

function logout(){
  saveToken(null);
  state.view = "auth";
  state.reports = [];
  state.profile = null;
  state.agreement = null;
  state.authorization = null;
  staffAuth = null; staffDrafts = null; staffDraftsError = null;
  state.activeReportId = null;
  state.activeReport = null;
  adminAnalytics = null; adminAnalyticsError = null;
  staffClients = null; staffClientsError = null; staffClientsLoading = false;
  staffSelectedClientId = null; staffSelectedClientReports = null; staffSelectedClientError = null;
  chatOpen = false; chatMessages = []; chatHistory = [];
  adminOffers = null; adminOffersError = null; adminOffersLoading = false;
  state.establishFrom = null;
  state.getReportFrom = null;
  cfpbPacketText = null;
  cfpbDraft = null; idtSelected = {}; idtConfirm = false;
  render();
}

/* ---------- data loaders ---------- */
function loadProfile(){
  return api("/staff/profile/me").then(function(p){
    state.profile = p;
  }).catch(function(){
    // not fatal -- the address card just stays in its empty state
  });
}

function loadAgreement(){
  return api("/staff/agreement/current").then(function(a){
    state.agreement = a;
  }).catch(function(){
    state.agreement = null; // feature off or unavailable: the normal unlock button shows
  });
}

function loadAuthorization(){
  return api("/authorization/current").then(function(a){
    state.authorization = a;
  }).catch(function(){
    state.authorization = null;
  });
}

function authPost(path, payload, okMsg){
  clearBanner();
  return api(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: payload ? JSON.stringify(payload) : undefined
  }).then(function(a){
    state.authorization = a;
    if (okMsg) setBanner("ok", okMsg); else render();
  }).catch(function(e){
    setBanner("error", e.message);
  });
}

function loadReportsList(){
  return Promise.all([
    api("/reports").then(function(list){ state.reports = list; }),
    loadProfile(),
    loadAgreement(),
    loadAuthorization()
  ]);
}

function loadReportDetail(reportId){
  var bundle = { summary: null, progress: null, violations: [], tradelines: [], letters: [], recSummary: null, recommendations: [], litigation: [], idt: null };
  return api("/reports/" + reportId + "/summary").then(function(s){
    bundle.summary = s;
    var calls = [
      api("/reports/" + reportId + "/recommendations/summary").then(function(r){ bundle.recSummary = r; }).catch(function(){}),
      api("/reports/" + reportId + "/progress").then(function(p){ bundle.progress = p; }).catch(function(){}),
    ];
    if (s.is_paid){
      calls.push(api("/reports/" + reportId + "/violations").then(function(v){ bundle.violations = v; }).catch(function(){}));
      calls.push(api("/reports/" + reportId + "/tradelines").then(function(t){ bundle.tradelines = t; }).catch(function(){}));
      calls.push(api("/reports/" + reportId + "/letters").then(function(l){ bundle.letters = l; }).catch(function(){}));
      calls.push(api("/reports/" + reportId + "/recommendations").then(function(r){ bundle.recommendations = r; }).catch(function(){}));
      calls.push(api("/reports/" + reportId + "/letters/idtheft/status").then(function(i){ bundle.idt = i; }).catch(function(){}));
      calls.push(api("/reports/" + reportId + "/letters/litigation-candidates").then(function(l){ bundle.litigation = l; }).catch(function(){}));
    }
    return Promise.all(calls);
  }).then(function(){
    state.activeReport = bundle;
    state.activeReportId = reportId;
  });
}

var cfpbPacketText = null; // fetched on demand when the client clicks "Get complaint packet"
var cfpbDraft = null;      // complaint drafts, fetched on demand
var idtSelected = {};      // tradeline id -> true: accounts ticked in the identity theft guide
var idtConfirm = false;    // the "these accounts are not mine" box

function openReport(reportId){
  cfpbPacketText = null;
  cfpbDraft = null; idtSelected = {}; idtConfirm = false;
  setBusy(true);
  loadReportDetail(reportId).then(function(){
    setBusy(false);
    render();
  }).catch(function(e){
    setBusy(false);
    setBanner("error", e.message);
  });
}

function refreshActiveReport(){
  if (!state.activeReportId) return Promise.resolve();
  return loadReportDetail(state.activeReportId);
}

/* ---------- actions ---------- */
function doClientSignup(email, password, fullName, orgSlug){
  clearBanner(); setBusy(true);
  return api("/auth/signup/client", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email: email, password: password, full_name: fullName || null, org_slug: orgSlug }),
  }).then(function(tok){
    saveToken(tok.access_token);
    state.view = "client";
    return loadReportsList();
  }).then(function(){
    setBusy(false);
    render();
  }).catch(function(e){
    setBusy(false);
    setBanner("error", e.message);
  });
}

function doLogin(email, password){
  clearBanner(); setBusy(true);
  return apiLogin(email, password).then(function(tok){
    saveToken(tok.access_token);
    if (state.tokenPayload && state.tokenPayload.type === "user"){
      state.view = "admin";
      setBusy(false);
      render();
      return;
    }
    state.view = "client";
    return loadReportsList().then(function(){
      setBusy(false);
      render();
    });
  }).catch(function(e){
    setBusy(false);
    setBanner("error", e.message);
  });
}

function doSaveProfile(payload){
  clearBanner(); setBusy(true);
  api("/staff/profile/me", {

function copyFrom(elId, btn){
  var el = document.getElementById(elId);
  if (!el) return;
  var text = el.textContent;
  function done(){ if (btn){ var old = btn.textContent; btn.textContent = "Copied"; setTimeout(function(){ btn.textContent = old; }, 1500); } }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(el, done); });
  } else { fallbackCopy(el, done); }
}
function fallbackCopy(el, done){
  var r = document.createRange(); r.selectNodeContents(el);
  var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  try{ document.execCommand("copy"); done(); }catch(e){}
}

/* ---------- chat widget ---------- */
var chatOpen = false;
var chatMessages = [];   // [{role:'user'|'assistant', content}], for display
var chatHistory = [];    // same shape, capped, sent to the API as conversation context
var chatSending = false;

function toggleChat(){ chatOpen = !chatOpen; render(); }

function doSendChat(text){
  text = (text || "").trim();
  if (!text || chatSending) return;
  var historyBeforeThisTurn = chatHistory.slice();
  chatMessages.push({ role: "user", content: text });
  chatHistory.push({ role: "user", content: text });
  chatHistory = chatHistory.slice(-20);
  chatSending = true;
  render();

  api("/assistant/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text, report_id: state.activeReportId || null, history: historyBeforeThisTurn }),
  }).then(function(res){
    chatSending = false;
    chatMessages.push({ role: "assistant", content: res.reply });
    chatHistory.push({ role: "assistant", content: res.reply });
    chatHistory = chatHistory.slice(-20);
    render();
  }).catch(function(e){
    chatSending = false;
    chatMessages.push({ role: "assistant", content: "Sorry, something went wrong: " + e.message });
    render();
  });
}

function renderChatWidget(){
  if (state.view !== "client") return "";
  var html = "";
  if (chatOpen){
    var msgs = chatMessages.map(function(m){
      return '<div class="chat-msg ' + (m.role === "user" ? "user" : "assistant") + '">' + esc(m.content) + '</div>';
    }).join("");
    if (!chatMessages.length){
      msgs = '<div class="chat-msg assistant">Hi! I can walk you through how BlackBridge works, or answer questions about your own report once you’ve uploaded one — what do you want to know?</div>';
    }
    html += '' +
    '<div class="chat-panel">' +
      '<div class="chat-head"><strong>BlackBridge Assistant</strong><button type="button" class="icon-btn" data-chat-close="1">✕</button></div>' +
      '<div class="chat-body" id="chatBody">' + msgs + (chatSending ? '<div class="chat-msg-loading"><span class="spinner" style="border-top-color:var(--text-dim);border-color:rgba(0,0,0,.15);"></span></div>' : '') + '</div>' +
      '<form class="chat-input-row" id="chatForm">' +
        '<input type="text" id="chatInput" placeholder="Ask a question…" autocomplete="off">' +
        '<button type="submit"' + (chatSending ? " disabled" : "") + '>Send</button>' +
      '</form>' +
    '</div>';
  }
  html += '<button type="button" class="chat-toggle" data-chat-toggle="1" title="Help / walkthrough">' + (chatOpen ? "✕" : "💬") + '</button>';
  return html;
}

/* ---------- render: shell ---------- */
function render(){
  var app = document.getElementById("app");
  var topActions = document.getElementById("topActions");
  topActions.innerHTML = "";

  if (state.token && state.tokenPayload){
    var pill = document.createElement("span");
    pill.className = "pill";
    pill.textContent = state.tokenPayload.type === "user" ? "Staff / Admin" : "My account";
    var out = document.createElement("button");
    out.className = "secondary";
    out.textContent = "Log out";
    out.onclick = logout;
    topActions.appendChild(pill);
    topActions.appendChild(out);
  }

  var html = "";
  if (state.banner){
    html += '<div class="banner ' + state.banner.kind + '">' + esc(state.banner.text) + "</div>";
  }

  if (state.view === "auth"){
    html += renderAuthView();
  } else if (state.view === "client"){
    html += state.activeReportId ? renderReportDetailView() : renderClientDashboard();
  } else if (state.view === "admin"){
    html += renderAdminView();
  } else if (state.view === "establish"){
    html += renderEstablishView();
  } else if (state.view === "get_report"){
    html += renderGetReportView();
  } else {
    html += '<div class="empty">Loading…</div>';
  }

  html += renderChatWidget();

  app.innerHTML = html;
  bindEvents();

  if (chatOpen){
    var chatBody = document.getElementById("chatBody");
    if (chatBody) chatBody.scrollTop = chatBody.scrollHeight;
  }
}

function renderProgressSection(b){
  if (!b.progress) return "";
  var p = b.progress;
  var steps = p.steps.map(function(step, i){
    var cls = step.done ? "done" : (step.key === p.current_stage ? "current" : "");
    var isLast = i === p.steps.length - 1;
    return '' +
    '<div class="step ' + cls + '">' +
      (isLast ? "" : '<div class="line"></div>') +
      '<div class="dot2">' + (step.done ? "✓" : (i + 1)) + '</div>' +
      '<div class="label">' + esc(step.label) + '</div>' +
    '</div>';
  }).join("");

  var counts = '' +
    '<div class="row-wrap" style="margin-top:14px;">' +
      '<span class="pill">' + p.letters_generated + ' letters generated</span>' +
      '<span class="pill">' + p.letters_with_outcome + ' outcomes recorded</span>' +
      (p.letters_pending_outcome > 0 ? '<span class="pill">' + p.letters_pending_outcome + ' awaiting response</span>' : "") +
      (p.litigation_candidates ? '<span class="badge high">' + p.litigation_candidates + ' flagged for attorney review</span>' : "") +
    '</div>';

  var currentLine = p.current_stage === "complete"
    ? '<p class="disclaimer">All pipeline steps complete for this report.</p>'
    : '<p class="disclaimer">Currently: ' + esc(p.current_stage_label) + '</p>';

  return '<div class="card"><h2>Progress</h2><div class="stepper">' + steps + '</div>' + counts + currentLine + '</div>';
}

function renderViolationsSection(b){
  if (!b.violations.length){
    return '<div class="card"><h2>Findings</h2><div class="empty">No disputable findings on this report.</div></div>';
  }
  var creditorByTradeline = {};
  b.tradelines.forEach(function(t){ creditorByTradeline[t.id] = t.creditor_name; });

  var items = b.violations.map(function(v){
    var creditor = creditorByTradeline[v.tradeline_id] || "Account";
    return '' +
    '<div class="violation">' +
      '<div class="top">' +
        '<div><strong>' + esc(creditor) + '</strong><div class="muted">' + esc(v.rule_id) + '</div></div>' +
        '<span class="badge ' + esc(v.severity) + '">' + esc(v.severity) + '</span>' +
      '</div>' +
      '<p style="margin-top:8px;">' + esc(v.description) + '</p>' +
      '<div class="muted">Legal basis: ' + esc(v.legal_basis) + '</div>' +
    '</div>';
  }).join("");
  return '<div class="card"><h2>Findings (' + b.violations.length + ')</h2>' + items + '</div>';
}

      '<p class="muted"><strong>If you mail it:</strong> send copies only and keep your originals. Cover everything except the last four digits of any Social Security number you attach. Use certified mail with a return receipt so you have proof of delivery. Each letter lists what to enclose at the bottom.</p>' +
      '<p class="muted" style="margin-bottom:0;"><strong>If you dispute online instead:</strong> use the bureau’s own dispute site. Sign in to your account there, then copy the facts from the letter (the account and why it is wrong) into their form. Leave out the “Enclosures” list at the bottom. Upload proof only if the site asks for it.</p>' +
    '</div>' +
  '</details>';

  return '<div class="card"><h2>Dispute letters</h2>' + addressWarn + guide + actions + '<div style="margin-top:14px;">' + list + '</div></div>';
}

function renderIdentityTheftSection(b, reportId){
  var i = b.idt;
  var head = '<h2>Identity theft block (FCRA §605B)</h2>';
  if (!i){
    return '<div class="card">' + head + '<p class="muted">The identity theft guide could not load. Refresh the page and try again.</p></div>';
  }
  var cur = i.current_step;
  var stepsHtml = i.steps.map(function(step, n){
    var cls = step.done ? "done" : (step.key === cur ? "current" : "");
    return '<div class="step ' + cls + '">' +
      (n === i.steps.length - 1 ? "" : '<div class="line"></div>') +
      '<div class="dot2">' + (step.done ? "✓" : (n + 1)) + '</div>' +
      '<div class="label">' + esc(step.label) + '</div></div>';
  }).join("");

  var busy = state.busy ? " disabled" : "";

  // step 1: the FTC report
  var step1 = '' +
    '<h3>Step 1: File your FTC identity theft report</h3>' +
    '<p>Only you can do this part. It is free and takes about 15 minutes. Go to identitytheft.gov, tell them what happened, and save the report as a PDF. If a company later asks for a police report too, you can file one locally.</p>' +
    '<div class="row-wrap"><a class="btn" href="' + esc(i.ftc_url) + '" target="_blank" rel="noopener">Open identitytheft.gov</a></div>' +
    '<form id="idtCaseForm" data-report="' + esc(reportId) + '" class="row-wrap" style="margin-top:12px;">' +
      '<input type="text" id="idt_number" placeholder="Your FTC report number" value="' + esc(i.report_number || "") + '" style="flex:1;min-width:200px;">' +
      '<button type="submit" class="secondary"' + busy + '>' + (i.report_number ? "Update number" : "Save number") + '</button>' +
    '</form>' +
    (i.report_number ? '<p class="disclaimer">Saved. We never file or look up your report for you.</p>' : "");

  // step 2: pick accounts + confirm
  var rows = i.accounts.map(function(a){
    var label = esc(a.creditor_name || "Unnamed account") + (a.account_number_last4 ? " (ending " + esc(a.account_number_last4) + ")" : "");
    if (a.has_letter){
      var note = a.outcome_status ? "response: " + esc(a.outcome_status) : (a.past_window ? "no response recorded, past the deadline" : "waiting " + (a.days_waiting || 0) + " day(s)");
      return '<div class="row-wrap" style="padding:6px 0;"><span style="flex:1;">' + label + '</span><span class="badge paid">Letter created</span><span class="muted">' + note + '</span></div>';
    }
    return '<label class="row-wrap" style="padding:6px 0;cursor:pointer;">' +
      '<input type="checkbox" data-idt-acct="' + esc(a.tradeline_id) + '"' + (idtSelected[a.tradeline_id] ? " checked" : "") + ' style="width:18px;height:18px;flex:none;">' +
      '<span style="flex:1;">' + label + '</span></label>';
  }).join("");
  var anyOpen = i.accounts.some(function(a){ return !a.has_letter; });

  var step2 = '' +
    '<h3>Step 2: Pick the accounts that are not yours</h3>' +
    '<p>Only tick accounts you did not open and did not authorize. Do not tick an account you opened yourself, even if you no longer want it. A bureau can reverse a block that was based on a false statement.</p>' +
    '<div>' + rows + '</div>' +
    (anyOpen ?
      '<div class="notice-box" style="border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:10px;">' +
        '<label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer;">' +
          '<input type="checkbox" id="idt_confirm"' + (idtConfirm ? " checked" : "") + ' style="width:18px;height:18px;margin-top:2px;flex:none;">' +
          '<span style="font-size:13.5px;font-weight:400;">' + esc(i.attestation_text) + '</span>' +
        '</label>' +
      '</div>' +
      '<button type="button" id="idtGenerateBtn" data-report="' + esc(reportId) + '" class="secondary block" style="margin-top:12px;"' + busy + '>Create block letters for ticked accounts</button>'
      : '<p class="disclaimer">Every account on this report already has a block letter.</p>');

  // step 3: mail
  var step3 = '' +
    '<h3>Step 3: Mail each letter with these enclosures</h3>' +
    '<ul style="margin:6px 0 0 18px;">' + i.enclosures.map(function(e){ return '<li>' + esc(e) + '</li>'; }).join("") + '</ul>' +
    '<p>Send a separate packet to each bureau that shows the account. Certified mail with a tracking number is best. Keep copies of everything. Use the bureau\'s current fraud or identity theft address from its website.</p>';

  // step 4: wait and record
  var late = i.accounts.filter(function(a){ return a.past_window; }).length;
  var step4 = '' +
    '<h3>Step 4: Record each response</h3>' +
    '<p>A bureau must block the information within 4 business days after it receives your letter and documents. Record what comes back under Your letters above.' +
    (late ? ' <strong>' + late + ' letter(s) are past the ' + i.wait_days + '-day mark with no response recorded.</strong> Use the CFPB complaint draft below.' : '') + '</p>';

  return '<div class="card">' + head +
    '<p>If an account is not yours, this is the fastest route. It needs your own FTC identity theft report. We guide you, but you file the report and mail the letters yourself.</p>' +
    '<div class="stepper" style="margin:12px 0;">' + stepsHtml + '</div>' +
    '<div class="divider"></div>' + step1 +
    '<div class="divider"></div>' + step2 +
    '<div class="divider"></div>' + step3 +
    '<div class="divider"></div>' + step4 +
  '</div>';
}

    '<div class="divider"></div>' +
    '<h3>Late payment -- statement timing (TILA §1666b)</h3>' +
    '<p>Only fits if a creditor marked a payment late but either mailed your statement less than 21 days before the due date, or didn’t credit your payment as of the day it was received. Not a way to remove late payments in general.</p>' +
    '<form id="latePaymentForm" data-report="' + esc(reportId) + '" class="stack">' +
      '<div class="field"><label>Account</label><select id="lp_tradeline">' + options + '</select></div>' +

      '<div class="field"><label>Notes (optional)</label><input type="text" id="lp_notes" placeholder="e.g. statement was mailed only 10 days before the due date"></div>' +

    '</form>' +
  '</div>';

function renderCfpbDraft(reportId){
  var d = cfpbDraft;
  if (!d) return "";
  var out = '<div class="divider"></div><p><strong>' + esc(d.message) + '</strong></p>';
  d.complaints.forEach(function(c, n){
    out += '' +
    '<div class="violation" style="margin-top:12px;">' +
      '<div class="top"><strong>Complaint ' + (n + 1) + ': ' + esc(c.company) + '</strong><span class="pill">' + c.item_count + ' item(s)</span></div>' +
      '<p class="disclaimer">On the CFPB form, look for: <strong>' + esc(c.product) + '</strong> &rarr; <strong>' + esc(c.issue) + '</strong> &rarr; <strong>' + esc(c.sub_issue) + '</strong>. The form\'s wording changes, so pick the closest option.</p>' +
      '<div class="row-wrap" style="justify-content:space-between;"><span class="muted">What happened (' + c.narrative_chars + ' characters)</span><button type="button" class="secondary" data-copy="cfpb_n_' + n + '">Copy</button></div>' +
      '<pre id="cfpb_n_' + n + '" style="white-space:pre-wrap;">' + esc(c.narrative) + '</pre>' +
      '<div class="row-wrap" style="justify-content:space-between;"><span class="muted">What I want done</span><button type="button" class="secondary" data-copy="cfpb_r_' + n + '">Copy</button></div>' +
      '<pre id="cfpb_r_' + n + '" style="white-space:pre-wrap;">' + esc(c.resolution) + '</pre>' +
    '</div>';
  });
  if (d.not_yet && d.not_yet.length){
    out += '<p class="muted" style="margin-top:12px;">Still inside the response window:</p><ul style="margin:4px 0 0 18px;">' +
      d.not_yet.map(function(x){ return '<li>' + esc(x.company) + ' / ' + esc(x.creditor_name || "account") + ': sent ' + esc(x.sent_on) + ', ' + x.days_left + ' day(s) left</li>'; }).join("") + '</ul>';
  }
  if (d.ready){
    out += '<p style="margin-top:12px;"><strong>Before you file, check each one:</strong></p><ul style="margin:4px 0 0 18px;">' +
      d.checklist.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ul>' +
      '<p class="disclaimer">This is a draft built from your own records. Read it, fix anything that is not exactly true, and file it yourself. It is not legal advice.</p>';
  }
  return out;
}

  var p = b.progress;

  var statusLine = filed
    ? '<span class="badge paid">Filed' + (p.cfpb_complaint_outcome ? " -- " + esc(p.cfpb_complaint_outcome) : "") + '</span>'

    packetBlock = '<details open style="margin-top:12px;"><summary class="muted">Complaint packet -- copy into the CFPB form</summary><pre>' + esc(cfpbPacketText) + '</pre></details>';

  return '' +
  '<div class="card">' +

      '<h2 style="margin:0;">File a CFPB complaint</h2>' +

    '<p>A CFPB complaint is a real federal process, separate from mailing a dispute letter -- the company is required to respond to the CFPB directly, which often gets faster attention than a mailed letter alone. <strong>This app never creates an account or submits anything for you</strong> -- you create your own free account and submit it yourself.</p>' +
    '<div class="row-wrap">' +
      '<button type="button" data-cfpb-draft="' + esc(reportId) + '"' + (state.busy ? " disabled" : "") + '>Draft my complaint</button>' +

      '<a class="btn" href="https://www.consumerfinance.gov/complaint/" target="_blank" rel="noopener">Go to consumerfinance.gov/complaint</a>' +

    '<div class="divider"></div>' +
    '<form id="cfpbFiledForm" data-report="' + esc(reportId) + '" class="row-wrap">' +
      '<select id="cfpb_outcome">' +
        '<option value="">I filed my complaint...</option>' +
        '<option value="in_progress">In progress</option>' +

      '<button type="submit" class="secondary"' + (state.busy ? " disabled" : "") + '>Save</button>' +

/* ---------- render: admin / operator console ---------- */
var adminAnalytics = null;
var adminAnalyticsError = null;
var staffClients = null;
var staffClientsError = null;
var staffSelectedClientId = null;
var staffSelectedClientReports = null;
var staffSelectedClientError = null;
var staffClientsLoading = false;
var staffAuth = null;          // authorization status for the open client
var staffDrafts = null;        // complaint drafts for the open client (only when allowed)
var staffDraftsError = null;

function loadStaffAuth(clientId){
  api("/authorization/staff/client/" + clientId).then(function(a){
    staffAuth = a; render();
  }).catch(function(){ staffAuth = null; render(); });
}

function doStaffServiceType(clientId, kind){
  clearBanner(); setBusy(true);
  api("/staff/clients/" + clientId + "/service-type", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ service_type: kind }),
  }).then(function(){
    staffDrafts = null; staffDraftsError = null;
    return api("/authorization/staff/client/" + clientId).then(function(a){ staffAuth = a; });
  }).then(function(){
    setBusy(false); setBanner("ok", "Service type saved."); render();
  }).catch(function(e){ setBusy(false); setBanner("error", e.message); render(); });
}

function doStaffLoadDrafts(clientId){
  clearBanner(); setBusy(true);
  api("/authorization/staff/client/" + clientId + "/cfpb-drafts").then(function(res){
    staffDrafts = res; staffDraftsError = null; setBusy(false); render();
  }).catch(function(e){
    staffDrafts = null; staffDraftsError = e.message; setBusy(false); render();
  });
}

function doStaffMarkFiled(clientId, reportId, company, number){
  clearBanner(); setBusy(true);
  api("/authorization/staff/client/" + clientId + "/filed", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ report_id: reportId, company: company, complaint_number: number || null }),
  }).then(function(){
    return api("/authorization/staff/client/" + clientId).then(function(a){ staffAuth = a; });
  }).then(function(){
    setBusy(false); setBanner("ok", "Filing logged. The client can see it in their account."); render();
  }).catch(function(e){ setBusy(false); setBanner("error", e.message); render(); });
}

function loadStaffClients(){
  if (staffClientsLoading) return;
  staffClientsLoading = true;
  api("/staff/clients").then(function(list){
    staffClientsLoading = false;
    staffClients = list;
    render();
  }).catch(function(e){
    staffClientsLoading = false;
    staffClientsError = e.message;
    render();
  });
}

function openStaffClient(clientId){
  staffSelectedClientId = clientId;
  staffSelectedClientReports = null;
  staffSelectedClientError = null;
  staffAuth = null; staffDrafts = null; staffDraftsError = null;
  loadStaffAuth(clientId);
  render();
  api("/staff/clients/" + clientId + "/reports").then(function(reports){
    staffSelectedClientReports = reports;
    render();
  }).catch(function(e){
    staffSelectedClientError = e.message;
    render();
  });
}

function renderStaffRemoveClient(clientId, client){
  if (!client || !staffAuth) return ""; // wait until the page has finished loading, so typing is not wiped
  return '<div class="divider"></div><h3>Remove this client</h3>' +
    '<p class="muted">Deletes their reports, accounts, letters and mailing address, and frees their email so they can sign up again. It cannot be undone. Their signed agreement and authorization records are kept for the legally required time. Only an organization admin can do this.</p>' +
    '<div class="row-wrap">' +
      '<input type="text" id="rm_email" placeholder="Type their email to confirm: ' + esc(client.email) + '" style="flex:1;min-width:220px;">' +
      '<button type="button" class="secondary" data-staff-remove="' + esc(clientId) + '"' + (state.busy ? " disabled" : "") + '>Remove client</button>' +
    '</div>';
}

function doStaffRemoveClient(clientId, email){
  if (!email){ setBanner("error", "Type the client's email to confirm."); return; }
  if (!window.confirm("Remove this client permanently? This cannot be undone.")) return;
  clearBanner(); setBusy(true);
  api("/authorization/staff/client/" + clientId + "/remove", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ confirm_email: email }),
  }).then(function(res){
    staffSelectedClientId = null; staffSelectedClientReports = null; staffSelectedClientError = null;
    staffAuth = null; staffDrafts = null; staffDraftsError = null;
    staffClients = null; staffClientsLoading = false;
    setBusy(false);
    setBanner("ok", "Client removed. " + res.reports_removed + " report(s) deleted. Their email can be used to sign up again.");
    loadStaffClients();
  }).catch(function(e){ setBusy(false); setBanner("error", e.message); render(); });
}

          '<div class="row-wrap" style="margin-top:6px;"><input type="text" id="sd_num_' + ri + '_' + ci + '" placeholder="CFPB complaint number (optional)" style="flex:1;min-width:180px;">' +
          '<button type="button" data-staff-filed="' + esc(clientId) + '|' + esc(rep.report_id) + '|' + ri + '|' + ci + '"' + (state.busy ? " disabled" : "") + '>Mark as filed</button></div>' +
        '</div>';
      });
      h += '</div>';
    });
  }
  if (a.filings && a.filings.length){
    h += '<p style="margin-top:12px;"><strong>Filed so far</strong></p><ul style="margin:4px 0 0 18px;">' +
      a.filings.map(function(f){ return '<li>' + esc(f.company) + ', ' + esc(fmtDate(f.filed_at)) + (f.complaint_number ? ', #' + esc(f.complaint_number) : '') + '</li>'; }).join("") + '</ul>';
  }
  return h;
}

/* ---------- boot ---------- */
function boot(){
  loadToken();
  if (state.token && state.tokenPayload){
    if (state.tokenPayload.type === "user"){
      state.view = "admin";
      render();
      adminAnalyticsError = null; adminAnalytics = null;
      loadAnalytics(function(err, stats){
        if (err) adminAnalyticsError = err.message; else adminAnalytics = stats;
        render();
      });
      return;
    }
    state.view = "client";
    render();
    loadReportsList().then(render).catch(function(e){
      // token likely stale/expired server-side
      logout();
    });
    return;
  }
  state.view = "auth";
  render();
}

// Re-fetch analytics / the client list whenever we land on the admin view
// fresh (e.g. after login), without re-fetching on every re-render.
var _origRender = render;
render = function(){
  _origRender();
  if (state.view === "admin" && !adminAnalytics && !adminAnalyticsError){
    loadAnalytics(function(err, stats){
      if (err) adminAnalyticsError = err.message; else adminAnalytics = stats;
      _origRender();
    });
  }
  if (state.view === "admin" && !staffClients && !staffClientsError){
    loadStaffClients();
  }
  if (state.view === "admin" && !adminOffers && !adminOffersError){
    loadAdminOffers();
  }
  if ((state.view === "client" || state.view === "establish") && !publicOffers && !publicOffersError){
    loadPublicOffers();
  }
};

boot();
})();
</script>
</body>
</html>
