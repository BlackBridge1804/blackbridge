  ]).then(function(){ bld.loadingOv = false; render(); });
}
function bldReloadStaff(msg){ bld.ov = undefined; bld.settings = undefined; bld.cl = null; bld.clLoading = null; bld.msg = msg || null; bld.loadingOv = false; bldLoadStaff(); }

function bldLoadClient(id){
  if (bld.clLoading === id) return; bld.clLoading = id;
  api("/builder/staff/clients/" + encodeURIComponent(id)).then(function(j){ bld.cl = { id: id, data: j }; })
    .catch(function(){ bld.cl = { id: id, data: null }; })
    .then(function(){ bld.clLoading = null; render(); });
}

function bldProgressBar(p){
  var pct = p.total ? Math.round(100 * p.done / p.total) : 0;
  return '<div style="background:var(--border);border-radius:8px;height:10px;overflow:hidden;margin:6px 0;"><div style="width:' + pct + '%;height:100%;background:var(--brand);"></div></div>' +
    '<div class="muted">' + p.done + ' of ' + p.total + ' required steps done</div>';
}

function bldTaskRows(plan, canCoach, prefix){
  var h = '';
  plan.tasks.forEach(function(t){
    var mine = canCoach || t.who === "client";
    var chk = t.done_at ? '<span class="badge paid">Done</span>' : (t.overdue ? '<span class="badge bad">Late</span>' : '<span class="badge unpaid">To do</span>');
    h += '<div style="border-top:1px solid var(--border);padding:10px 0;">' +
      '<div class="row-wrap" style="justify-content:space-between;gap:8px;"><div><strong>' + esc(t.title) + '</strong>' +
      (t.optional ? ' <span class="muted">(optional)</span>' : '') + (t.who === "coach" ? ' <span class="pill">coach</span>' : '') +
      '<div class="muted">Due ' + esc(fmtD(t.due_at)) + '</div></div><div>' + chk + '</div></div>' +
      '<div class="muted" style="margin-top:4px;">' + esc(t.detail || "") + '</div>' +
      (mine && t.key.indexOf("checkin_") !== 0 ? '<button class="secondary" style="margin-top:6px;" data-bld-task="' + prefix + '|' + esc(t.id) + '|' + (t.done_at ? "0" : "1") + '">' + (t.done_at ? "Undo" : "Mark done") + '</button>' : '') +
      '</div>';
  });
  return h;
}

function bldCheckinRows(plan, who){
  var h = '<h3 style="margin-top:14px;">Check-ins</h3>';
  plan.checkins.forEach(function(c){
    h += '<div class="row-wrap" style="justify-content:space-between;border-top:1px solid var(--border);padding:8px 0;gap:8px;">' +
      '<div><strong>' + c.day + '-day check-in</strong><div class="muted">Due ' + esc(fmtD(c.due_at)) + (c.accounts_found != null ? ' · ' + c.accounts_found + ' account(s) on the report you picked' : '') + '</div></div><div>' +
      (c.completed_at ? '<span class="badge paid">Done ' + esc(fmtD(c.completed_at)) + '</span>'
        : ((who === "coach" || c.open_now) && plan.status === "active" ? '<button class="secondary" data-bld-checkin="' + who + '|' + c.day + '">Complete check-in</button>' : '<span class="muted">Opens 3 days before it is due</span>')) +
      '</div></div>';
  });
  return h;
}

function bldPayBox(me, plan){
  if (!plan.owed_now_cents) return "";
  var p = me.pay, h = '<div class="banner warn" style="margin-top:12px;"><strong>Payment due now: ' + esc(plan.owed_now_text) + '</strong> for steps already finished.';
  if (p && p.contact){
    h += '<br>Send it by Zelle to <strong>' + esc(p.contact) + '</strong>' + (p.name ? ' (shows as ' + esc(p.name) + ')' : '') + ' and put <strong>' + esc(p.memo) + '</strong> in the note.' + (p.note ? '<br>' + esc(p.note) : '');
  }
  if (p && p.instructions) h += '<br>' + esc(p.instructions);
  return h + '</div>';
}

function renderBuilderCard(){
  var me = bld.me;
  if (me === undefined) return "";
  if (!me || !me.enabled) return "";
  var plan = me.plan;
  var h = '<div class="card"><h2>Credit Builder</h2>' + (bld.msg ? '<div class="banner ok">' + esc(bld.msg) + '</div>' : '') + (bld.err ? '<div class="banner error">' + esc(bld.err) + '</div>' : '');

  if (plan && plan.status === "active" || plan && plan.status === "completed"){
    h += '<p><strong>' + esc(plan.tier_label) + '</strong> · ' + esc(plan.track_label) + ' · day ' + plan.day + (plan.status === "completed" ? ' · <span class="badge paid">Finished</span>' : '') + '</p>' + bldProgressBar(plan.progress);
    h += bldPayBox(me, plan);
    h += '<div class="muted" style="margin-top:6px;">Paid so far ' + esc(plan.paid_text) + ' of ' + esc(plan.price_text) + '. Nothing is charged until the matching step is done.</div>';
    h += '<h3 style="margin-top:14px;">Your steps</h3>' + bldTaskRows(plan, false, "me") + bldCheckinRows(plan, "me");
    if (plan.status === "active"){
      h += '<div style="margin-top:14px;border-top:1px solid var(--border);padding-top:10px;"><button class="link" data-bld-cancel="me">Cancel this plan</button>' +
        '<div class="muted">' + (plan.can_cancel_free ? 'You can cancel free of charge, and get back anything you paid, until ' + esc(fmtD(plan.cancel_until)) + '.' : 'You can cancel any time. Steps not yet done will not be charged.') + '</div></div>';
    }
  } else if (plan && plan.status === "offered"){
    h += '<p>Your coach offered you the <strong>' + esc(plan.tier_label) + '</strong> (' + esc(plan.price_text) + ') starting from: ' + esc(plan.track_label) + '.</p>';
    var tt = me.tiers.filter(function(x){ return x.id === plan.tier; })[0];
    h += '<details><summary>Read the agreement</summary><pre style="white-space:pre-wrap;">' + esc(tt ? tt.agreement_text : plan.agreement_text || "") + '</pre></details>' +
      '<label style="display:flex;gap:8px;margin:10px 0;"><input type="checkbox" id="bld_accept"' + (bld.accept ? " checked" : "") + '> <span>I have read the agreement and I accept it.</span></label>' +
      '<button data-bld-enroll="offer"' + (state.busy ? " disabled" : "") + '>Accept and start</button> <button class="secondary" data-bld-cancel="me">No thanks</button>';
  } else {
    if (plan && plan.status === "cancelled"){
      h += '<p class="muted">Your last plan was cancelled' + (plan.refund_due > 0 ? '. We owe you ' + esc(plan.refund_due_text) + ' back.' : '.') + ' You are welcome to start again.</p>';
    }
    h += '<p>No credit history, or very little? This is a 90-day plan that takes you from nothing to real, reporting accounts, step by step. We do not promise any score. You apply for each product yourself, using only your own real Social Security number or ITIN.</p>';
    if (me.suggestion){
      h += '<p class="' + (me.suggestion.track ? 'muted' : 'banner warn') + '">' + esc(me.suggestion.reason) + '</p>';
    }
    if (me.start_funds_text){
      h += '<p class="banner warn"><strong>Plan on about ' + esc(me.start_funds_text) + ' of your own money</strong> for account deposits and fees (a secured card deposit, credit-builder payments). You pay it straight to the bank or lender, in your own name. ' + esc(me.business) + ' never holds or collects it.</p>';
    }
    h += '<div class="field"><label>Where are you starting from?</label><select id="bld_track">';
    var cur = bld.track || (me.suggestion && me.suggestion.track) || "thin";
    me.tracks.forEach(function(t){ h += '<option value="' + t.id + '"' + (t.id === cur ? " selected" : "") + '>' + esc(t.label) + '</option>'; });
    h += '</select></div><div class="grid-2">';
    me.tiers.forEach(function(t){
      h += '<label class="offer-card" style="cursor:pointer;' + (bld.tier === t.id ? 'border:2px solid var(--brand);' : '') + '"><div class="row-wrap" style="justify-content:space-between;"><strong>' + esc(t.label) + '</strong><span style="font-size:20px;font-weight:700;">' + esc(t.price_text) + '</span></div>' +
        '<div class="muted" style="margin:6px 0;">' + esc(t.summary) + '</div>' +
        '<div class="muted">You pay in steps, only after each one is done:</div><ul style="margin:4px 0 8px 18px;">' + t.milestones.map(function(m){ return '<li>' + esc(m.label) + ': ' + esc(m.amount_text) + '</li>'; }).join("") + '</ul>' +
        '<input type="radio" name="bld_tier" value="' + t.id + '"' + (bld.tier === t.id ? " checked" : "") + '> Choose this one</label>';
    });
    h += '</div>';
    var sel = me.tiers.filter(function(x){ return x.id === bld.tier; })[0] || me.tiers[0];
    h += '<details style="margin-top:10px;"><summary>Read the agreement</summary><pre style="white-space:pre-wrap;">' + esc(sel.agreement_text) + '</pre></details>' +
      '<label style="display:flex;gap:8px;margin:10px 0;"><input type="checkbox" id="bld_accept"' + (bld.accept ? " checked" : "") + '> <span>I have read the agreement and I accept it. I understand there is no guaranteed result.</span></label>' +
      '<button class="block" data-bld-enroll="new"' + (state.busy ? " disabled" : "") + '>Start my 90-day plan</button>';
  }

  // tools and sites
  if (me.guide){
    h += '<details style="margin-top:14px;"><summary>Helpful sites and what to look for</summary>' +
      '<ul style="margin:8px 0 8px 18px;">' + me.guide.sites.map(function(s){ return '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.name) + '</a>: ' + esc(s.why) + '</li>'; }).join("") + '</ul>' +
      me.guide.products.map(function(p){ return '<p><strong>' + esc(p.name) + '.</strong> ' + esc(p.what) + '<br><span class="muted">Check: ' + p.check.map(esc).join("; ") + '.</span></p>'; }).join("") + '</details>';
  }
  h += '</div>';
  return h + renderPartnerOffersSection(["credit_builder_loan", "secured_card", "rent_reporting"]);
}

function renderStaffBuilder(clientId){
  var d = (bld.cl && bld.cl.id === clientId) ? bld.cl.data : undefined;
  var h = '<div class="divider"></div><h3>Credit Builder</h3>' + (bld.msg ? '<div class="banner ok">' + esc(bld.msg) + '</div>' : '');
  if (d === undefined){ return h + '<p class="muted">Loading…</p>'; }
  if (d === null){ return h + '<p class="muted">The Credit Builder is not switched on for your business.</p>'; }
  var plan = d.plan;
  if (!plan || plan.status === "cancelled" || plan.status === "completed"){
    if (plan) h += '<p class="muted">Last plan: ' + esc(plan.tier_label) + ' (' + esc(plan.status) + ')' + (plan.refund_due > 0 ? ' · refund owed ' + esc(plan.refund_due_text) : '') + '</p>';
    h += '<p class="muted">' + esc(d.suggestion.reason) + '</p><div class="row-wrap" style="gap:8px;">' +
      '<select id="bldo_tier">' + d.tiers.map(function(t){ return '<option value="' + t.id + '">' + esc(t.label) + ' (' + esc(d.prices[t.id]) + ')</option>'; }).join("") + '</select>' +
      '<select id="bldo_track">' + d.tracks.map(function(t){ return '<option value="' + t.id + '"' + (t.id === d.suggestion.track ? " selected" : "") + '>' + esc(t.label) + '</option>'; }).join("") + '</select>' +
      '<button data-bld-offer="' + esc(clientId) + '">Offer this plan</button></div>' +
      '<p class="muted">The client must read and accept the agreement before anything starts.</p>';
    return h;
  }
  h += '<p><strong>' + esc(plan.tier_label) + '</strong> · ' + esc(plan.track_label) + ' · ' + esc(plan.status) + (plan.status === "active" ? ' · day ' + plan.day : '') + '</p>';
  if (plan.status === "offered"){
    return h + '<p class="muted">Waiting for the client to read and accept the agreement.</p><button class="secondary" data-bld-cancel="' + esc(plan.id) + '">Withdraw offer</button>';
  }
  h += bldProgressBar(plan.progress) + '<div class="muted">Accepted ' + esc(fmtD(plan.accepted_at)) + ' from ' + esc(plan.accepted_ip || "unknown IP") + ' · agreement ' + esc(plan.agreement_version || "") + '</div>';
  h += '<h3 style="margin-top:12px;">Payments</h3><table><tr><th>Step</th><th>Amount</th><th>Status</th><th></th></tr>';
  plan.milestones.forEach(function(m){
    var st = m.paid ? '<span class="badge paid">Paid ' + esc(fmtD(m.paid_at)) + (m.paid_method ? ' · ' + esc(m.paid_method) : '') + '</span>' : m.dropped ? '<span class="badge unpaid">Cancelled</span>' : m.reached ? '<span class="badge bad">Due now</span>' : '<span class="muted">Not yet earned' + (m.label.indexOf("check-in") === -1 && plan.can_cancel_free ? ' (free-cancel window open)' : '') + '</span>';
    var act = m.paid ? '<button class="secondary" data-bld-unpaid="' + esc(plan.id) + '|' + esc(m.id) + '">Undo</button>' : (m.reached && !m.dropped ? '<button data-bld-paid="' + esc(plan.id) + '|' + esc(m.id) + '">Mark received</button>' : '');
    h += '<tr><td>' + esc(m.label) + '</td><td>' + esc(m.amount_text) + '</td><td>' + st + '</td><td>' + act + '</td></tr>';
  });
  h += '</table>';
  if (plan.milestones.some(function(m){ return m.reached && !m.paid && !m.dropped; })){
    h += '<div class="row-wrap" style="gap:8px;margin-top:6px;"><span class="muted">Paid by</span><select id="bld_method"><option>Zelle</option><option>ACH</option><option>Wire</option><option>Cash App</option><option>PayPal</option><option>Check</option><option>Cash</option><option>Other</option></select><input type="text" id="bld_ref" placeholder="Reference (optional)" style="flex:1;min-width:140px;"></div>';
  }
  if (plan.cancelled_within_window === null && plan.status === "active"){
    h += '<div class="muted" style="margin-top:6px;">Client can cancel free until ' + esc(fmtD(plan.cancel_until)) + '.</div>';
  }
  h += '<h3 style="margin-top:12px;">Steps</h3>' + bldTaskRows(plan, true, "staff:" + plan.id) + bldCheckinRows(plan, "coach");
  h += '<div class="field" style="margin-top:10px;"><label>Coach note (private)</label><textarea id="bld_note" rows="2">' + esc(plan.coach_note || "") + '</textarea></div>' +
    '<div class="row-wrap" style="gap:8px;"><button class="secondary" data-bld-note="' + esc(plan.id) + '">Save note</button><button class="secondary" data-bld-cancel="' + esc(plan.id) + '">Cancel this plan</button></div>';
  return h;
}

function renderBuilderWorklistCard(){
  var ov = bld.ov;
  if (ov === undefined || ov === null) return "";
  var h = '<div class="card"><h2>Credit Builder worklist</h2><p>Clients on a 90-day plan, with what needs your attention.</p>';
  if (!ov.plans.length){
    h += '<div class="empty">No one is on a Credit Builder plan yet. Open a client and press "Offer this plan", or clients can start on their own. Your prices: guided ' + esc(ov.prices.guided) + ', coaching ' + esc(ov.prices.coaching) + '.</div></div>';
    return h;
  }
  h += '<table><tr><th>Client</th><th>Plan</th><th>Day</th><th>Steps</th><th>Late</th><th>Next check-in</th><th>Owed now</th></tr>';
  ov.plans.forEach(function(p){
    h += '<tr style="cursor:pointer;" data-open-client="' + esc(p.client_id) + '"><td>' + esc(p.client) + '</td><td>' + esc(p.tier_label) + (p.status === "offered" ? ' <span class="badge unpaid">offered</span>' : '') + '</td><td>' + p.day + '</td><td>' + p.progress.done + '/' + p.progress.total + '</td><td>' + (p.overdue_tasks ? '<span class="badge bad">' + p.overdue_tasks + '</span>' : '0') + '</td><td>' + (p.next_checkin_day ? p.next_checkin_day + 'd · ' + esc(fmtD(p.next_checkin_due)) : '-') + '</td><td>' + esc(p.owed_now_text) + '</td></tr>';
  });
  return h + '</table></div>';
}

function renderBuilderSettingsCard(){
  var s = bld.settings;
  if (!s || !s.available) return "";
  return '<div class="card"><h2>Credit Builder prices</h2><p>The 90-day Credit Builder is sold to your clients as its own service, separate from credit repair. ' + (s.platform ? 'These are the main site prices.' : 'Set your own prices.') + '</p>' +
    (s.platform ? '<p class="muted">The main site prices come from Render (PRICE_BUILDER_GUIDED and PRICE_BUILDER_COACHING).</p>' : '') +
    '<div class="grid-2"><div class="field"><label>Guided plan ($)</label><input type="text" id="bs2_guided" value="' + esc(s.price_guided) + '"' + (s.platform ? " disabled" : "") + '></div>' +
    '<div class="field"><label>Coaching plan ($)</label><input type="text" id="bs2_coaching" value="' + esc(s.price_coaching) + '"' + (s.platform ? " disabled" : "") + '></div></div>' +
    (s.platform ? '' : '<label style="display:flex;gap:8px;margin:8px 0;"><input type="checkbox" id="bs2_enabled"' + (s.enabled ? " checked" : "") + '> <span>Offer the Credit Builder to my clients</span></label><button id="bs2_save">Save</button>') + '</div>';
}

function bldAfterRender(app){
  var $ = function(id){ return document.getElementById(id); };
  var fail = function(e){ bld.err = e.message; render(); };
  if (state.view === "client" && bld.me === undefined && !bld.loadingMe){ bldLoadMe(); return; }
  if (state.view === "admin"){
    if (bld.ov === undefined && !bld.loadingOv){ bldLoadStaff(); return; }
    if (staffSelectedClientId && bld.ov && !(bld.cl && bld.cl.id === staffSelectedClientId) && bld.clLoading !== staffSelectedClientId){ bldLoadClient(staffSelectedClientId); return; }
  }
  var acc = $("bld_accept"); if (acc) acc.addEventListener("change", function(){ bld.accept = acc.checked; });
  var trk = $("bld_track"); if (trk) trk.addEventListener("change", function(){ bld.track = trk.value; });
  app.querySelectorAll("input[name=bld_tier]").forEach(function(r){ r.addEventListener("change", function(){ bld.tier = r.value; render(); }); });
  app.querySelectorAll("[data-bld-enroll]").forEach(function(b){
    b.addEventListener("click", function(){
      var offer = b.getAttribute("data-bld-enroll") === "offer";
      var plan = bld.me && bld.me.plan;
      var body = offer && plan ? { tier: plan.tier, track: plan.track, accept_terms: !!($("bld_accept") && $("bld_accept").checked) }
        : { tier: bld.tier, track: ($("bld_track") ? $("bld_track").value : undefined), accept_terms: !!($("bld_accept") && $("bld_accept").checked) };
      if (!body.accept_terms){ bld.err = "Please tick the box to accept the agreement."; render(); return; }
      bld.err = null; licPost("/builder/me/enroll", body).then(function(){ bld.accept = false; bldReloadMe("Your plan has started. Here are your first steps."); }).catch(fail);
    });
  });
  app.querySelectorAll("[data-bld-task]").forEach(function(b){
    b.addEventListener("click", function(){
      var p = b.getAttribute("data-bld-task").split("|"), who = p[0], tid = p[1], done = p[2] === "1";
      if (who === "me"){ licPost("/builder/me/tasks/" + tid + "/done", { done: done }).then(function(){ bldReloadMe(); }).catch(fail); }
      else { var pid = who.split(":")[1]; licPost("/builder/staff/plans/" + pid + "/tasks/" + tid + "/done", { done: done }).then(function(){ bldRefreshStaffClient(); }).catch(fail); }
    });
  });
  app.querySelectorAll("[data-bld-checkin]").forEach(function(b){
    b.addEventListener("click", function(){
      var p = b.getAttribute("data-bld-checkin").split("|");
      if (p[0] === "me"){ licPost("/builder/me/checkins/" + p[1] + "/complete", {}).then(function(){ bldReloadMe("Check-in saved."); }).catch(fail); }
      else { var plan = bld.cl && bld.cl.data && bld.cl.data.plan; if (!plan) return; licPost("/builder/staff/plans/" + plan.id + "/checkins/" + p[1] + "/complete", {}).then(function(){ bldRefreshStaffClient("Check-in saved."); }).catch(fail); }
    });
  });
  app.querySelectorAll("[data-bld-cancel]").forEach(function(b){
    b.addEventListener("click", function(){
      var who = b.getAttribute("data-bld-cancel");
      if (!window.confirm("Cancel this plan?")) return;
      if (who === "me"){ licPost("/builder/me/cancel").then(function(){ bldReloadMe("Plan cancelled."); }).catch(fail); }
      else { licPost("/builder/staff/plans/" + who + "/cancel").then(function(){ bldRefreshStaffClient("Plan cancelled."); }).catch(fail); }
    });
  });
  app.querySelectorAll("[data-bld-offer]").forEach(function(b){
    b.addEventListener("click", function(){
      licPost("/builder/staff/clients/" + b.getAttribute("data-bld-offer") + "/offer", { tier: $("bldo_tier").value, track: $("bldo_track").value })
        .then(function(){ bldRefreshStaffClient("Offer sent. The client sees it on their dashboard."); }).catch(fail);
    });
  });
  app.querySelectorAll("[data-bld-paid]").forEach(function(b){
    b.addEventListener("click", function(){
      var p = b.getAttribute("data-bld-paid").split("|");
      licPost("/builder/staff/plans/" + p[0] + "/milestones/" + p[1] + "/paid", { method: $("bld_method") ? $("bld_method").value : "", reference: $("bld_ref") ? $("bld_ref").value : "" })
        .then(function(){ bldRefreshStaffClient("Payment recorded."); }).catch(fail);
    });
  });
  app.querySelectorAll("[data-bld-unpaid]").forEach(function(b){
    b.addEventListener("click", function(){
      var p = b.getAttribute("data-bld-unpaid").split("|");
      licPost("/builder/staff/plans/" + p[0] + "/milestones/" + p[1] + "/unpaid").then(function(){ bldRefreshStaffClient("Undone."); }).catch(fail);
    });
  });
  app.querySelectorAll("[data-bld-note]").forEach(function(b){
    b.addEventListener("click", function(){
      licPost("/builder/staff/plans/" + b.getAttribute("data-bld-note") + "/note", { note: $("bld_note").value }).then(function(){ bldRefreshStaffClient("Note saved."); }).catch(fail);
    });
  });
  var sv = $("bs2_save");
  if (sv) sv.addEventListener("click", function(){
    api("/builder/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ enabled: $("bs2_enabled").checked, price_guided: $("bs2_guided").value, price_coaching: $("bs2_coaching").value }) })
      .then(function(){ bldReloadStaff("Saved."); }).catch(fail);
  });
}

function bldRefreshStaffClient(msg){
  var id = staffSelectedClientId; bld.msg = msg || null; bld.err = null; bld.cl = null; bld.clLoading = null; bld.ov = undefined; bld.loadingOv = false; bld.settings = undefined;
  if (id) bldLoadClient(id); else render();
}

// Re-fetch analytics / the client list whenever we land on the admin view
// fresh (e.g. after login), without re-fetching on every re-render.
var _origRender = render;
render = function(){
  _origRender();
  if (state.view === "admin" && !adminAnalytics && !adminAnalyticsError){
    loadAnalytics(function(err, stats){
      if (err) adminAnalyticsError = err.message; else adminAnalytics = stats;
      _origRender();
    });
  }
  if (state.view === "admin" && !staffClients && !staffClientsError){
    loadStaffClients();
  }
  if (state.view === "admin" && !adminOffers && !adminOffersError){
    loadAdminOffers();
  }
  if ((state.view === "client" || state.view === "establish") && !publicOffers && !publicOffersError){
    loadPublicOffers();
  }
};

boot();
})();
</script>
</body>
